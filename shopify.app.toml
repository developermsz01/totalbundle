# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "1111a600a0bd472b8fd773a7a191d29e"
name = "TotalBundles"
application_url = "https://totalbundle.vercel.app/"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_discounts,write_discounts,read_product_feeds,write_product_feeds,read_products,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [
  "https://totalbundle.vercel.app/auth/callback",
  "https://totalbundle.vercel.app/auth/shopify/callback",
  "https://totalbundle.vercel.app/api/auth/callback"
]
